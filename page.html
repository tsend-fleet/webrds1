<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <script>
    (function(){
      var m = localStorage.getItem('delta_theme_mode') || 'auto';
      if (m === 'auto') m = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.classList.add(m === 'light' ? 'light' : 'dark');
    })();
  </script>

  <title>Page — Maxwell Roadside</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800;900&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/aos@2.3.4/dist/aos.css">

  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: {
        colors: {
          'background':'var(--c-bg)','on-background':'var(--c-text)',
          'surface':'var(--c-surface)','surface-container':'var(--c-surface)',
          'surface-container-low':'var(--c-surface-alt)','surface-container-lowest':'var(--c-surface-deep)',
          'surface-container-high':'var(--c-surface-emphasis)','on-surface':'var(--c-text)',
          'on-surface-variant':'var(--c-text-muted)','outline':'var(--c-border)',
          'tertiary':'var(--c-accent)','cta':'var(--c-cta)','cta-hover':'var(--c-cta-hover)',
          'header-bg':'var(--c-header-bg)',
          'primary':'#b30400','on-primary':'#ffffff','tertiary-fixed-dim':'#ecc300',
        },
        fontFamily: {
          'display-hero':['Manrope'],'headline-lg':['Manrope'],'headline-md':['Manrope'],
          'phone-number':['Manrope'],'body-lg':['Inter'],'body-md':['Inter'],'label-caps':['Inter'],
        },
        fontSize: {
          'display-hero':['clamp(2.25rem,5vw,3rem)',{lineHeight:'1.1',letterSpacing:'-0.02em',fontWeight:'800'}],
          'headline-lg':['clamp(1.75rem,4vw,2rem)',{lineHeight:'1.2',fontWeight:'800'}],
          'headline-md':['1.5rem',{lineHeight:'1.3',fontWeight:'700'}],
          'phone-number':['2.5rem',{lineHeight:'1',fontWeight:'800'}],
          'body-lg':['1.125rem',{lineHeight:'1.6',fontWeight:'500'}],
          'body-md':['1rem',{lineHeight:'1.5',fontWeight:'400'}],
          'label-caps':['0.875rem',{lineHeight:'1',letterSpacing:'0.05em',fontWeight:'700'}],
        },
        spacing: {'margin-mobile':'20px','gutter':'16px','touch-target-min':'56px','stack-gap':'24px','margin-desktop':'40px','unit':'8px'},
        borderRadius: {DEFAULT:'0.125rem',lg:'0.25rem',xl:'0.5rem',full:'0.75rem'},
      }},
    }
  </script>
  <style>
    .material-symbols-outlined { font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    body { font-family: 'Inter', sans-serif; }
    h1, h2, h3, h4 { font-family: 'Manrope', sans-serif; }
  </style>
</head>

<body data-delta-app="page" class="bg-background text-on-background antialiased pb-24 md:pb-0 min-h-screen flex flex-col">

  <header class="sticky top-0 z-[100] bg-surface border-b-2 border-outline">
    <div class="max-w-7xl mx-auto flex justify-between items-center px-4 md:px-margin-desktop h-16 md:h-20">
      <div class="flex items-center gap-3">
        <button data-delta-trigger="mobile-nav" aria-label="Menu" class="md:hidden flex items-center justify-center w-12 h-12 text-on-background hover:bg-surface-container-low">
          <span class="material-symbols-outlined">menu</span>
        </button>
        <a href="index.html" class="text-lg md:text-xl font-black text-cta uppercase tracking-tighter italic"><span data-delta="brand">Maxwell Roadside</span></a>
      </div>
      <nav data-delta="nav.desktop" class="hidden md:flex items-center gap-8"></nav>
      <div class="flex items-center gap-2">
        <button data-delta-trigger="theme-toggle" aria-label="Toggle theme" class="hidden md:flex items-center justify-center w-10 h-10 text-on-background hover:bg-surface-container-low rounded-full">
          <span class="material-symbols-outlined" data-delta-theme-icon="dark">light_mode</span>
          <span class="material-symbols-outlined" data-delta-theme-icon="light" style="display:none">dark_mode</span>
        </button>
        <a data-delta-href="phone" href="tel:" class="btn-magnetic hidden md:inline-flex items-center gap-2 bg-cta text-on-primary h-12 px-5 font-label-caps text-label-caps uppercase border-2 border-outline hover:bg-cta-hover">
          <span class="material-symbols-outlined">call</span>
          <span data-delta="phoneDisplay">(806) 555-0124</span>
        </a>
        <a data-delta-href="phone" href="tel:" class="md:hidden inline-flex items-center justify-center bg-cta text-on-primary w-12 h-12 border-2 border-outline">
          <span class="material-symbols-outlined">call</span>
        </a>
      </div>
    </div>
    <nav data-delta-target="mobile-nav" class="md:hidden fixed inset-y-0 right-0 w-3/4 max-w-xs bg-surface border-l-2 border-outline transform translate-x-full transition-transform duration-300 z-[101] pt-20 overflow-y-auto">
      <div data-delta="nav.mobile"></div>
    </nav>
  </header>

  <main class="flex-1">
    <section id="page-not-found" style="display:none" class="py-20 px-margin-mobile md:px-margin-desktop text-center">
      <div class="max-w-xl mx-auto flex flex-col gap-4">
        <span class="material-symbols-outlined text-6xl text-cta mx-auto">error</span>
        <h1 class="font-headline-lg text-headline-lg">Page Not Found</h1>
        <a href="index.html" class="inline-block bg-cta text-on-primary h-touch-target-min px-6 leading-[56px] mt-4 font-label-caps text-label-caps uppercase border-2 border-outline hover:bg-cta-hover">← Back to Home</a>
      </div>
    </section>

    <section id="page-content" class="py-12 md:py-16 px-margin-mobile md:px-margin-desktop">
      <article class="max-w-3xl mx-auto">
        <h1 data-delta="page.title" class="font-display-hero text-display-hero text-on-background mb-8 border-b-2 border-on-background pb-4"></h1>
        <div data-delta="page.blocks"></div>
      </article>
    </section>
  </main>

  <footer class="bg-header-bg text-white py-10 px-margin-mobile md:px-margin-desktop border-t-4 border-tertiary-fixed-dim mt-12">
    <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between gap-4">
      <span class="text-xl font-black text-cta uppercase italic"><span data-delta="brand"></span></span>
      <a data-delta-href="phone" href="tel:" class="font-phone-number text-3xl text-cta hover:text-cta-hover">
        <span data-delta="phoneDisplay"></span>
      </a>
    </div>
  </footer>

  <nav class="md:hidden fixed bottom-0 left-0 w-full z-50 flex items-stretch justify-around bg-header-bg border-t-4 border-tertiary-fixed-dim h-20">
    <a data-delta-trigger="call" href="tel:" aria-label="Call" class="flex flex-col items-center justify-center bg-cta text-on-primary w-full h-full font-label-caps text-label-caps uppercase">
      <span class="material-symbols-outlined mb-1">call</span>CALL
    </a>
    <a data-delta-trigger="text" href="sms:" aria-label="Text" class="flex flex-col items-center justify-center text-white w-full h-full font-label-caps text-label-caps uppercase hover:bg-cta">
      <span class="material-symbols-outlined mb-1">chat</span>TEXT
    </a>
    <button data-delta-trigger="location" aria-label="Location" class="flex flex-col items-center justify-center text-white w-full h-full font-label-caps text-label-caps uppercase hover:bg-cta">
      <span class="material-symbols-outlined mb-1">location_on</span>LOCATION
    </button>
  </nav>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
  <script src="delta-engine.js"></script>

  <script>
    (async function() {
      try {
        var c = await DeltaEngine.loadContent();
        DeltaEngine.applyTheme(c);
        DeltaEngine.bindThemeToggle();
        DeltaEngine.renderPage(c);

        // Wire phone hrefs
        document.querySelectorAll('[data-delta="phoneDisplay"]').forEach(el => el.textContent = c.phoneDisplay || '');
        document.querySelectorAll('a[data-delta-href="phone"]').forEach(a => a.href = 'tel:' + (c.phone || ''));

        DeltaEngine.bindMobileNav();
        DeltaEngine.bindMobileCTABar(c);
        DeltaEngine.bindMagneticButtons();

        if (window.gsap) {
          gsap.from('#page-content > article > *', { y: 30, opacity: 0, duration: 0.7, stagger: 0.08, ease: 'power3.out' });
        }
      } catch (e) {
        console.error('Page boot failed:', e);
      }
    })();
  </script>
</body>
</html>
